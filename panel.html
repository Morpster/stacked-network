<!doctype html>
<meta charset="utf-8">
<title>Requests</title>

<style>
  :root {
    --bg: #ffffff;
    --fg: #0c0c0d;
    --muted: #737373;
    --control-bg: #f0f0f4;
    --control-hover: #e0e0e6;
    --border: #d7d7db;
    --accent: #0a84ff;
    color-scheme: light;
  }

  :root[data-theme="dark"] {
    --bg: #232327;
    --fg: #f9f9fa;
    --muted: #b1b1b3;
    --control-bg: #38383d;
    --control-hover: #4a4a4f;
    --border: #4a4a4f;
    --accent: #75bfff;
    color-scheme: dark;
  }

  body {
    margin: 0;
    padding: 12px;
    font: message-box;
    background: var(--bg);
    color: var(--fg);
  }

  :root:not([data-theme="dark"]) body {
    border-left: 4px solid #b1b1b3;
    min-height: 100vh;
    box-sizing: border-box;
  }

  button,
  input {
    font: inherit;
    color: var(--fg);
    background: var(--control-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
  }

  button:hover:not(:disabled) {
    background: var(--control-hover);
  }

  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  #filter {
    flex: 1;
  }

  #requests {
    display: grid;
    gap: 4px;
  }

  .request {
    padding: 8px;
    text-align: left;
    overflow-wrap: anywhere;
  }

  .request[aria-current="true"] {
    outline: 2px solid var(--accent);
  }

  #details {
    margin-top: 16px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }

  .auth-headers summary {
    cursor: pointer;
    color: var(--muted);
  }

  #header-actions {
    display: flex;
    gap: 8px;
  }

  .section-fold,
  .section-fold:hover:not(:disabled) {
    border: 0;
    background: none;
    padding: 0;
    font: inherit;
    cursor: pointer;
  }

  .section-fold::before {
    content: "▾ ";
  }

  .section-fold[aria-expanded="false"]::before {
    content: "▸ ";
  }

  .section-fold.query-params {
    display: block;
    color: var(--muted);
  }

  :root {
    --bracket-0: #b8860b;
    --bracket-1: #c71585;
    --bracket-2: #0070c1;
  }

  :root[data-theme="dark"] {
    --bracket-0: #ffd700;
    --bracket-1: #da70d6;
    --bracket-2: #179fff;
  }

  :root[data-brackets="on"] .bracket-0 { color: var(--bracket-0); }
  :root[data-brackets="on"] .bracket-1 { color: var(--bracket-1); }
  :root[data-brackets="on"] .bracket-2 { color: var(--bracket-2); }

  :root {
    --json-key: #0451a5;
    --json-string: #a31515;
    --json-number: #098658;
    --json-literal: #0000ff;
  }

  :root[data-theme="dark"] {
    --json-key: #9cdcfe;
    --json-string: #ce9178;
    --json-number: #b5cea8;
    --json-literal: #569cd6;
  }

  :root[data-brackets="on"] .json-key { color: var(--json-key); }
  :root[data-brackets="on"] .json-string { color: var(--json-string); }
  :root[data-brackets="on"] .json-number { color: var(--json-number); }
  :root[data-brackets="on"] .json-boolean,
  :root[data-brackets="on"] .json-null { color: var(--json-literal); }

  :root {
    --status-info: #737373;
    --status-success: #058b00;
    --status-redirect: #0060df;
    --status-client-error: #b35c00;
    --status-server-error: #d70022;
  }

  :root[data-theme="dark"] {
    --status-info: #b1b1b3;
    --status-success: #54ffbd;
    --status-redirect: #75bfff;
    --status-client-error: #ffbd4f;
    --status-server-error: #ff848b;
  }

  :root[data-brackets="on"] .status { font-weight: 600; }
  :root[data-brackets="on"] .status-info { color: var(--status-info); }
  :root[data-brackets="on"] .status-success { color: var(--status-success); }
  :root[data-brackets="on"] .status-redirect { color: var(--status-redirect); }
  :root[data-brackets="on"] .status-client-error { color: var(--status-client-error); }
  :root[data-brackets="on"] .status-server-error { color: var(--status-server-error); }

  :root {
    --header-name: #8f00ad;
    --header-value: #0c0c0d;
    --http-method: #0060df;
  }

  :root[data-theme="dark"] {
    --header-name: #d7a0ff;
    --header-value: #f9f9fa;
    --http-method: #75bfff;
  }

  :root[data-brackets="on"] .header-name { color: var(--header-name); }
  :root[data-brackets="on"] .header-value { color: var(--header-value); }
  :root[data-brackets="on"] .http-method { color: var(--http-method); font-weight: 600; }

  .param-badge {
    display: inline-block;
    padding: 0 5px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.85em;
    color: var(--muted);
  }

  :root[data-brackets="on"] .param-badge { color: var(--accent); border-color: var(--accent); }
  :root[data-brackets="on"] .param-name { color: var(--json-key); }
  :root[data-brackets="on"] .param-value { color: var(--json-string); }

  .json-fold {
    border: 0;
    background: none;
    padding: 0 2px 0 0;
    font: inherit;
    color: var(--muted);
    cursor: pointer;
  }

  .json-fold:hover:not(:disabled) {
    background: none;
    color: var(--fg);
  }

  .json-fold::before {
    content: "▾";
  }

  .json-fold[aria-expanded="false"]::before {
    content: "▸";
  }

  .json-summary {
    color: var(--muted);
  }

  pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
</style>

<div id="header">
  <h2>Requests</h2>
  <div id="header-actions">
    <button id="bracket-toggle" type="button" aria-pressed="true">Colors: on</button>
    <button id="theme-toggle" type="button">Theme</button>
  </div>
</div>
<div id="toolbar">
  <input id="filter" type="search" placeholder="Filter by URL" aria-label="Filter by URL">
  <button id="clear">Clear</button>
</div>
<div id="requests">Waiting for requests…</div>
<section id="details" aria-live="polite">Select a request to see its details.</section>

<script src="no-network.js"></script>
<script src="panel.js"></script>
