<!doctype html>
<meta charset="utf-8">
<title>Requests</title>

<style>
  :root {
    --bg: #ffffff;
    --fg: #0c0c0d;
    --muted: #737373;
    --control-bg: #f0f0f4;
    --control-hover: #e0e0e6;
    --border: #d7d7db;
    --accent: #0a84ff;
    color-scheme: light;
  }

  :root[data-theme="dark"] {
    --bg: #232327;
    --fg: #f9f9fa;
    --muted: #b1b1b3;
    --control-bg: #38383d;
    --control-hover: #4a4a4f;
    --border: #4a4a4f;
    --accent: #75bfff;
    color-scheme: dark;
  }

  body {
    margin: 0;
    padding: 12px;
    font: message-box;
    background: var(--bg);
    color: var(--fg);
  }

  :root:not([data-theme="dark"]) body {
    border-left: 4px solid #b1b1b3;
    min-height: 100vh;
    box-sizing: border-box;
  }

  button,
  input {
    font: inherit;
    color: var(--fg);
    background: var(--control-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
  }

  button:hover:not(:disabled) {
    background: var(--control-hover);
  }

  /* Header + toolbar stay pinned while the page scrolls. Negative margins
     stretch the background over the body padding so nothing shows through. */
  #sticky-bar {
    position: sticky;
    top: 0;
    z-index: 20;
    margin: -12px -12px 8px;
    padding: 12px 12px 4px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }

  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  #filter {
    flex: 1;
  }

  .multi-filter {
    position: relative;
  }

  .multi-filter-button {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 100%;
    white-space: nowrap;
  }

  .multi-filter-button::after {
    content: "▾";
    color: var(--muted);
    font-size: 0.85em;
  }

  .multi-filter[data-active="true"] .multi-filter-button {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }

  .multi-filter-count {
    padding: 0 5px;
    border-radius: 8px;
    background: var(--accent);
    color: var(--bg);
    font-size: 0.8em;
    font-weight: 600;
  }

  .multi-filter-menu {
    position: absolute;
    z-index: 10;
    right: 0;
    margin-top: 4px;
    min-width: 140px;
    max-height: 50vh;
    overflow-y: auto;
    display: grid;
    padding: 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
  }

  .multi-filter-menu[hidden] {
    display: none;
  }

  .multi-filter-option,
  .multi-filter-reset {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 0;
    background: none;
    text-align: left;
    padding: 4px 8px;
  }

  .multi-filter-check {
    width: 12px;
    height: 12px;
    flex: none;
    border: 1px solid var(--muted);
    border-radius: 3px;
  }

  .multi-filter-option[aria-pressed="true"] .multi-filter-check {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: inset 0 0 0 2px var(--bg);
  }

  .multi-filter-reset {
    margin-top: 4px;
    border-top: 1px solid var(--border);
    border-radius: 0;
    color: var(--muted);
  }

  .multi-filter-empty {
    padding: 4px 8px;
    color: var(--muted);
  }

  #requests {
    display: grid;
    align-content: start;
    gap: 4px;
    max-height: 40vh;
    overflow-y: auto;
    padding: 2px; /* keeps the selected outline from being clipped */
  }

  #requests[data-expanded="true"] {
    max-height: none;
    overflow-y: visible;
  }

  /* Fades at the top/bottom edge when the list has more to scroll to. */
  #requests-frame {
    position: relative;
  }

  #requests-frame::before,
  #requests-frame::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 24px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
  }

  #requests-frame::before {
    top: 0;
    background: linear-gradient(var(--bg), transparent);
    border-top: 2px solid var(--accent);
  }

  #requests-frame::after {
    bottom: 0;
    background: linear-gradient(transparent, var(--bg));
    border-bottom: 2px solid var(--accent);
  }

  #requests-frame[data-more-above="true"]::before,
  #requests-frame[data-more-below="true"]::after {
    opacity: 1;
  }

  .request {
    padding: 8px;
    text-align: left;
    overflow-wrap: anywhere;
  }

  .request[aria-current="true"] {
    outline: 2px solid var(--accent);
  }

  .request .filter-match {
    background: none;
    color: var(--accent);
    font-weight: 700;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 2px;
  }

  #details {
    margin-top: 16px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }

  .auth-headers summary {
    cursor: pointer;
    color: var(--muted);
  }

  #header-actions {
    display: flex;
    gap: 8px;
  }

  .section-fold,
  .section-fold:hover:not(:disabled) {
    border: 0;
    background: none;
    padding: 0;
    font: inherit;
    cursor: pointer;
  }

  .section-fold::before {
    content: "▾ ";
  }

  .section-fold[aria-expanded="false"]::before {
    content: "▸ ";
  }

  .section-fold.query-params {
    display: block;
    color: var(--muted);
  }

  :root {
    --bracket-0: #856404;
    --bracket-1: #c71585;
    --bracket-2: #0070c1;
  }

  :root[data-theme="dark"] {
    --bracket-0: #ffd700;
    --bracket-1: #da70d6;
    --bracket-2: #179fff;
  }

  :root[data-brackets="on"] .bracket-0 { color: var(--bracket-0); }
  :root[data-brackets="on"] .bracket-1 { color: var(--bracket-1); }
  :root[data-brackets="on"] .bracket-2 { color: var(--bracket-2); }

  :root {
    --json-key: #0451a5;
    --json-string: #a31515;
    --json-number: #098658;
    --json-literal: #0000ff;
  }

  :root[data-theme="dark"] {
    --json-key: #9cdcfe;
    --json-string: #ce9178;
    --json-number: #b5cea8;
    --json-literal: #569cd6;
  }

  :root[data-brackets="on"] .json-key { color: var(--json-key); }
  :root[data-brackets="on"] .json-string { color: var(--json-string); }
  :root[data-brackets="on"] .json-number { color: var(--json-number); }
  :root[data-brackets="on"] .json-boolean,
  :root[data-brackets="on"] .json-null { color: var(--json-literal); }

  :root {
    --status-info: #5b5b66;
    --status-success: #047a00;
    --status-redirect: #0060df;
    --status-client-error: #9a4f00;
    --status-server-error: #d70022;
  }

  :root[data-theme="dark"] {
    --status-info: #b1b1b3;
    --status-success: #54ffbd;
    --status-redirect: #75bfff;
    --status-client-error: #ffbd4f;
    --status-server-error: #ff848b;
  }

  :root[data-brackets="on"] .status { font-weight: 600; }
  :root[data-brackets="on"] .status-info { color: var(--status-info); }
  :root[data-brackets="on"] .status-success { color: var(--status-success); }
  :root[data-brackets="on"] .status-redirect { color: var(--status-redirect); }
  :root[data-brackets="on"] .status-client-error { color: var(--status-client-error); }
  :root[data-brackets="on"] .status-server-error { color: var(--status-server-error); }

  :root {
    --header-name: #8f00ad;
    --header-value: #0c0c0d;
    --http-method: #0060df;
  }

  :root[data-theme="dark"] {
    --header-name: #d7a0ff;
    --header-value: #f9f9fa;
    --http-method: #75bfff;
  }

  :root[data-brackets="on"] .header-name { color: var(--header-name); }
  :root[data-brackets="on"] .header-value { color: var(--header-value); }
  :root[data-brackets="on"] .http-method { color: var(--http-method); font-weight: 600; }

  /* Vivid palette: overrides syntax/status colors for both themes. */
  :root[data-palette="vivid"] {
    --accent: #e0218a;
    --bracket-0: #c99700;
    --bracket-1: #ff5a00;
    --bracket-2: #00838f;
    --json-key: #c2006d;
    --json-string: #1b8a2e;
    --json-number: #6a3df0;
    --json-literal: #1a5fd8;
    --status-success: #1b8a2e;
    --status-redirect: #0b72e7;
    --status-client-error: #c25400;
    --status-server-error: #e0115f;
    --header-name: #c2006d;
    --http-method: #7a3cff;
  }

  :root[data-palette="vivid"][data-theme="dark"] {
    --accent: #ff5fb4;
    --bracket-0: #ffd700;
    --bracket-1: #ff7b1c;
    --bracket-2: #40e0d0;
    --json-key: #ff79c6;
    --json-string: #7dff8a;
    --json-number: #bd93f9;
    --json-literal: #6fa8ff;
    --status-success: #7dff8a;
    --status-redirect: #5cc8ff;
    --status-client-error: #ffb86c;
    --status-server-error: #ff5c8a;
    --header-name: #ff79c6;
    --http-method: #5cc8ff;
  }

  .param-badge {
    display: inline-block;
    padding: 0 5px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.85em;
    color: var(--muted);
  }

  :root[data-brackets="on"] .param-badge { color: var(--http-method); border-color: var(--http-method); }
  :root[data-brackets="on"] .param-name { color: var(--json-key); }
  :root[data-brackets="on"] .param-value { color: var(--json-string); }

  .json-fold {
    border: 0;
    background: none;
    padding: 0 2px 0 0;
    font: inherit;
    color: var(--muted);
    cursor: pointer;
  }

  .json-fold:hover:not(:disabled) {
    background: none;
    color: var(--fg);
  }

  .json-fold::before {
    content: "▾";
  }

  .json-fold[aria-expanded="false"]::before {
    content: "▸";
  }

  .json-children {
    display: block;
  }

  .json-children[hidden] {
    display: none;
  }

  /* Hanging indent: the leading two spaces sit in the -2ch text-indent,
     so wrapped lines align with the start of the key/value. Nests
     naturally because padding is relative to the parent entry. */
  .json-entry {
    display: block;
    padding-left: 2ch;
    text-indent: -2ch;
  }

  .json-summary {
    color: var(--muted);
  }

  pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
</style>

<div id="sticky-bar">
<div id="header">
  <h2>Requests</h2>
  <div id="header-actions">
    <button id="bracket-toggle" type="button" aria-pressed="true">Colors: on</button>
    <button id="palette-toggle" type="button" aria-pressed="false">Palette: classic</button>
    <button id="theme-toggle" type="button">Theme</button>
  </div>
</div>
<div id="toolbar">
  <input id="filter" type="search" placeholder="Filter by URL" aria-label="Filter by URL">
  <div class="multi-filter" id="method-filter">
    <button class="multi-filter-button" type="button" aria-haspopup="true" aria-expanded="false">Method</button>
    <div class="multi-filter-menu" hidden></div>
  </div>
  <div class="multi-filter" id="status-filter">
    <button class="multi-filter-button" type="button" aria-haspopup="true" aria-expanded="false">Status</button>
    <div class="multi-filter-menu" hidden></div>
  </div>
  <button id="expand-list" type="button" aria-pressed="false">Expand list</button>
  <button id="clear">Clear</button>
</div>
</div>
<div id="requests-frame"><div id="requests">Waiting for requests…</div></div>
<section id="details" aria-live="polite">Select a request to see its details.</section>

<script src="no-network.js"></script>
<script src="panel.js"></script>
